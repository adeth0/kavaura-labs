<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kavaura Labs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f17;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 40px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
      line-height: 1.6;
    }

    .apps {
      margin-top: 30px;
      display: grid;
      gap: 12px;
    }

    .app {
      padding: 14px;
      border: 1px solid #2a3342;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      display: block;
      transition: 0.2s;
    }

    .app:hover {
      background: #1a2233;
    }

    .tagline {
      margin-top: 15px;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kavaura Labs</h1>
    <p>
      A personal data platform connecting finance, travel, and health into one system.
    </p>

    <div class="apps">
      <a class="app" href="https://spend.kavauralabs.com">SpendMapr → Finance insights</a>
      <a class="app" href="https://flight.kavauralabs.com">FlightMapr → Travel tracking</a>
      <a class="app" href="https://health.kavauralabs.com">HealthMapr → Activity & wellness</a>
    </div>

    <div class="tagline">
      Build clarity from your data.
    </div>
  </div>
</body>
</html>
